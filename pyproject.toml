[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alertwatch"
version = "0.1.0"
description = "YAML-configured page field watcher with Telegram or dry-run alerts"
requires-python = ">=3.11"
dependencies = [
  "httpx",
  "beautifulsoup4",
  "pydantic>=2",
  "click",
  "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
alertwatch = "alertwatch.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["alertwatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
