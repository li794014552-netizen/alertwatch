name: demo
url: http://127.0.0.1:8765/
fields:
  title:
    selector: h1
  price:
    selector: .price
poll_interval_seconds: 60
request:
  timeout: 15.0
  user_agent: AlertWatch/0.1
  retries: 2
telegram:
  bot_token: ${TELEGRAM_BOT_TOKEN}
  chat_id: ${TELEGRAM_CHAT_ID}
  dry_run: true
state_path: data/demo.db
log_path: data/demo.log
